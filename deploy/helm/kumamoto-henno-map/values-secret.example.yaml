# 秘密情報の雛形
# cp values-secret.example.yaml values-secret.yaml で複製して値を設定する（values-secret.yaml は .gitignore 済み）
secrets:
  dbPassword: change-me
  jwtSecret: change-me-to-random-string-at-least-32-chars
  resendApiKey: re_xxxxxxxx
  awsAccessKeyId: AKIAXXXXXXXX
  awsSecretAccessKey: xxxxxxxx
  # 以下は任意
  slackWebhookUrl: ""
  adminUsername: ""
  adminPassword: ""
  adminEmail: ""
  # cloudflared.enabled=true のとき必須（Cloudflare Zero Trust > Networks > Tunnels で発行）
  cloudflaredToken: eyJhIjoixxxxxxxx
  # db.backup.enabled=true のとき必須（R2 の API トークン）
  r2AccessKeyId: ""
  r2SecretAccessKey: ""
