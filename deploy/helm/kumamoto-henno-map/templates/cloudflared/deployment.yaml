{{- if .Values.cloudflared.enabled }}
{{- $ctx := dict "root" $ "component" "cloudflared" }}
{{- $c := .Values.cloudflared }}
# Cloudflare Tunnel（転送先は Cloudflare ダッシュボードで設定する）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "khm.fullname" . }}-cloudflared
  labels:
    {{- include "khm.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "khm.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "khm.componentLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: cloudflared
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "khm.secretName" . }}, key: cloudflared-token }
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
