{{- $ctx := dict "root" $ "component" "front" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "khm.fullname" . }}-front
  labels:
    {{- include "khm.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      {{- include "khm.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "khm.componentLabels" $ctx | nindent 8 }}
    spec:
      {{- include "khm.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: front
          image: {{ include "khm.image" (dict "root" $ "image" .Values.front.image) }}
          imagePullPolicy: {{ .Values.front.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
