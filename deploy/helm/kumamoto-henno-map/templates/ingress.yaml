{{- if .Values.ingress.enabled }}
{{- $fullname := include "khm.fullname" . }}
# front と back を同一オリジンで公開する（TLS は Cloudflare で終端）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "khm.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-back
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-front
                port:
                  name: http
    {{- end }}
{{- end }}
