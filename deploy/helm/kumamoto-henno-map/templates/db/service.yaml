{{- if .Values.db.enabled }}
{{- $ctx := dict "root" $ "component" "db" }}
# StatefulSet 用の Headless Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "khm.fullname" . }}-db
  labels:
    {{- include "khm.componentLabels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "khm.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
