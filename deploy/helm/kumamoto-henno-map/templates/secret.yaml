{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "khm.secretName" . }}
  labels:
    {{- include "khm.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword は必須です" $s.dbPassword | quote }}
  jwt-secret: {{ required "secrets.jwtSecret は必須です" $s.jwtSecret | quote }}
  resend-api-key: {{ required "secrets.resendApiKey は必須です" $s.resendApiKey | quote }}
  aws-access-key-id: {{ required "secrets.awsAccessKeyId は必須です" $s.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ required "secrets.awsSecretAccessKey は必須です" $s.awsSecretAccessKey | quote }}
  {{- with $s.slackWebhookUrl }}
  slack-webhook-url: {{ . | quote }}
  {{- end }}
  {{- if and $s.adminUsername $s.adminPassword $s.adminEmail }}
  admin-username: {{ $s.adminUsername | quote }}
  admin-password: {{ $s.adminPassword | quote }}
  admin-email: {{ $s.adminEmail | quote }}
  {{- end }}
  {{- if .Values.cloudflared.enabled }}
  cloudflared-token: {{ required "cloudflared.enabled=true のときは secrets.cloudflaredToken が必須です" $s.cloudflaredToken | quote }}
  {{- end }}
  {{- if and .Values.db.enabled .Values.db.backup.enabled }}
  r2-access-key-id: {{ required "db.backup.enabled=true のときは secrets.r2AccessKeyId が必須です" $s.r2AccessKeyId | quote }}
  r2-secret-access-key: {{ required "db.backup.enabled=true のときは secrets.r2SecretAccessKey が必須です" $s.r2SecretAccessKey | quote }}
  {{- end }}
{{- end }}
