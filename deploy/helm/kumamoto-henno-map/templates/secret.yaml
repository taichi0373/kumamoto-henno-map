{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
# stringData ではなく data を使う（stringData はキーを削除しても Helm のアップグレードで
# 実際の Secret から消えず、未設定にしたはずの値（例: ADMIN_*）が残り続けるため）
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "khm.secretName" . }}
  labels:
    {{- include "khm.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ required "secrets.dbPassword は必須です" $s.dbPassword | b64enc | quote }}
  jwt-secret: {{ required "secrets.jwtSecret は必須です" $s.jwtSecret | b64enc | quote }}
  resend-api-key: {{ required "secrets.resendApiKey は必須です" $s.resendApiKey | b64enc | quote }}
  aws-access-key-id: {{ required "secrets.awsAccessKeyId は必須です" $s.awsAccessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ required "secrets.awsSecretAccessKey は必須です" $s.awsSecretAccessKey | b64enc | quote }}
  {{- with $s.slackWebhookUrl }}
  slack-webhook-url: {{ . | b64enc | quote }}
  {{- end }}
  {{- if and $s.adminUsername $s.adminPassword $s.adminEmail }}
  admin-username: {{ $s.adminUsername | b64enc | quote }}
  admin-password: {{ $s.adminPassword | b64enc | quote }}
  admin-email: {{ $s.adminEmail | b64enc | quote }}
  {{- end }}
  {{- if .Values.cloudflared.enabled }}
  cloudflared-token: {{ required "cloudflared.enabled=true のときは secrets.cloudflaredToken が必須です" $s.cloudflaredToken | b64enc | quote }}
  {{- end }}
  {{- if and .Values.db.enabled .Values.db.backup.enabled }}
  r2-access-key-id: {{ required "db.backup.enabled=true のときは secrets.r2AccessKeyId が必須です" $s.r2AccessKeyId | b64enc | quote }}
  r2-secret-access-key: {{ required "db.backup.enabled=true のときは secrets.r2SecretAccessKey が必須です" $s.r2SecretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
