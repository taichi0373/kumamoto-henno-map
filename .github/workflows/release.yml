name: Release

# main 向け PR のクローズで起動し、job の if: で PR タイトルを判定して実行/スキップを決定する
# マージ方法（merge / squash）に関係なく判定できる
# workflow_dispatch でも手動実行可能
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン（例: v1.1.0）'
        required: true

env:
  TZ: Asia/Tokyo

# 同一ワークフローの並行実行を防止
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # タグ作成 と GitHub Release 作成
  release:
    name: Tag & Release
    # フォークからの PR ではリリースしない
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Release v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      # PR イベントの既定はテスト用マージ ref のため、main に入ったマージコミットを明示する
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      # バージョン番号を取得
      # PR タイトルと入力値はシェルに直接展開せず、環境変数で受け取る（スクリプトインジェクション対策）
      - name: Extract version number
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            # 入力値のフォーマットを検証
            if ! printf '%s\n' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "バージョン番号の形式が不正です（例: v1.1.0）: $VERSION"
              exit 1
            fi
          else
            # PR タイトル全体を厳密に検証してから抽出
            if ! printf '%s\n' "$PR_TITLE" | grep -qE '^Release v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "PR タイトルの形式が不正です（例: Release v1.1.0）: $PR_TITLE"
              exit 1
            fi
            VERSION="${PR_TITLE#Release }"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # タグを作成してプッシュ
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')
          if [ -n "$EXISTING_TAG_SHA" ]; then
            HEAD_SHA=$(git rev-parse HEAD)
            # 軽量タグは SHA 直接比較、注釈付きタグは ^{} で実コミットを取得して比較
            DEREF_SHA=$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')
            TAG_COMMIT_SHA="${DEREF_SHA:-$EXISTING_TAG_SHA}"
            if [ "$TAG_COMMIT_SHA" = "$HEAD_SHA" ]; then
              echo "タグ $VERSION は既に存在し、現在の HEAD ($HEAD_SHA) を指しているためスキップします"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 手動実行時は既存タグのリリースノート再生成を許可するためスキップ
              echo "タグ $VERSION は既に存在します（コミット: $TAG_COMMIT_SHA）。リリースノートの再生成のためスキップします"
            else
              echo "タグ $VERSION は既に存在しますが、異なるコミット ($TAG_COMMIT_SHA) を指しています（HEAD: $HEAD_SHA）"
              exit 1
            fi
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      # 前回タグ以降に develop にマージされた PR からリリースノートを生成
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 前回のタグを取得（現在のタグを除く直近のタグ）
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${VERSION}$" \
            | head -n 1)

          # 前回タグのマージ日時を基準に develop へのマージ済み PR を取得
          if [ -n "$PREV_TAG" ]; then
            # ISO 8601形式（タイムゾーン付き）で取得し、当日マージのPRも含める
            SINCE=$(git log -1 --format="%aI" "$PREV_TAG")
            PRS=$(gh pr list \
              --repo "${{ github.repository }}" \
              --base develop \
              --state merged \
              --search "merged:>=${SINCE}" \
              --limit 100 \
              --json number,title,labels \
              --jq '[.[] | select(.labels | map(.name) | index("リリースノート除外") == null) | "- " + .title + " (#" + (.number | tostring) + ")"] | reverse | .[]')
          else
            PRS=$(gh pr list \
              --repo "${{ github.repository }}" \
              --base develop \
              --state merged \
              --limit 100 \
              --json number,title,labels \
              --jq '[.[] | select(.labels | map(.name) | index("リリースノート除外") == null) | "- " + .title + " (#" + (.number | tostring) + ")"] | reverse | .[]')
          fi

          {
            echo "body<<NOTES_EOF"
            echo "## What's Changed"
            if [ -n "$PRS" ]; then
              echo "$PRS"
            else
              echo "- No changes"
            fi
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      # GitHub Release を作成
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
