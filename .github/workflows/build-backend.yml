name: Build for backend

# ワークフロー共有設定
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'タイムアウト（分）'
        type: number
        default: 20
      backend-dir:
        description: 'バックエンドディレクトリ'
        type: string
        default: 'apps/back'
      java-distribution:
        description: 'Javaディストリビューション'
        type: string
        default: 'temurin'
      java-version:
        description: 'Javaバージョン'
        type: string
        default: '21'

env:
  TZ: Asia/Tokyo
  BACKEND_DIR: ${{ inputs.backend-dir }}

# jobs: 動作内容
jobs:
  # バックエンドのビルド処理
  backend-build:
    name: Backend Build
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Github-hosted runner を使用
    runs-on: ubuntu-latest

    # テスト用PostgreSQLサービスコンテナ
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kumamoto_henno_map_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    # steps: 動作手順
    steps:

      # リポジトリ取得
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      # Java セットアップ
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: gradle

      # 実行権限
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # ビルド
      - name: Compile Java
        run: ./gradlew compileJava

      # テスト用DBスキーマ構築（DDL）
      - name: Set up test database schema
        run: |
          export PGPASSWORD=postgres
          for f in $(ls ../../config/database/DDL/TABLE/*.SQL | sort); do
            echo "Running DDL: $f"
            psql -h localhost -U postgres -d kumamoto_henno_map_test -f "$f"
          done

      # テスト用データ投入（DML）
      - name: Load test data
        run: |
          export PGPASSWORD=postgres
          for f in $(ls ../../config/database/DML/TABLE/*.SQL | sort); do
            echo "Running DML: $f"
            psql -h localhost -U postgres -d kumamoto_henno_map_test -f "$f"
          done

      # ユニットテスト実行
      - name: Run tests
        run: ./gradlew test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kumamoto_henno_map_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      # Javadoc 生成
      - name: Generate Javadoc
        run: ./gradlew javadoc

      # Javadoc アップロード
      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: backend-javadoc
          path: ${{ env.BACKEND_DIR }}/build/docs/javadoc
