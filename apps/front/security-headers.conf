# セキュリティヘッダー（vercel.json の headers と同一内容を維持すること）
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://use.fontawesome.com; font-src 'self' https://use.fontawesome.com; img-src 'self' data: blob: https://tile.openstreetmap.jp; connect-src 'self' https://tile.openstreetmap.jp https://nominatim.openstreetmap.org https://use.fontawesome.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
