# フロントエンド配信用 nginx 設定（vercel.json の headers / rewrites を移植）
# API（/kumamoto-henno-map/api）は Ingress でバックエンドへ振り分けるため、ここではプロキシしない
# ※ location 内で add_header を書くと server 階層の add_header は継承されないため、
#    セキュリティヘッダーは security-headers.conf を各 location で include する
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # nginx 標準の mime.types に webmanifest（vite-plugin-pwa が出力）が無いため追加する
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # ハッシュ付きの静的アセットは長期キャッシュ
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA フォールバック（Vue Router の History モード対応）
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ヘルスチェック用（Kubernetes の probe から利用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
